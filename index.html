<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Griffwechsel">
<meta name="theme-color" content="#ECEEE9">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Griffwechsel – Gitarre zu Ukulele</title>
<style>
:root{--ink:#1D2733;--paper:#ECEEE9;--card:#F7F8F5;--line:#8C97A0;--soft:#CDD2CB;--brass:#B07A1E;--uke:#1F7A74}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 14px;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#DCE0D9;border-radius:12px;padding:3px;gap:3px;margin-bottom:16px}
.tabs button{border:0;background:transparent;font:inherit;font-weight:600;padding:11px 8px;border-radius:9px;color:var(--ink);min-height:44px}
.tabs button.on{background:var(--ink);color:var(--paper)}
.hidden{display:none}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--soft);border-radius:12px;background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
input[type=text]:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
.hint{font-size:13px;color:#5B6671;margin:6px 2px 12px;min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.roots{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:12px}
.chip{border:1.5px solid var(--soft);background:var(--card);font:inherit;font-weight:600;font-size:16px;color:var(--ink);border-radius:11px;min-height:44px;padding:0 12px}
.roots .chip{padding:0}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chord{font-size:46px;line-height:1.05;margin:10px 0 2px;font-weight:700;letter-spacing:-0.5px}
.notes{margin:0 0 14px;color:#4A5560;font-size:15px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1.5px solid var(--soft);border-radius:14px;padding:10px 8px 12px;text-align:center}
.card h3{margin:2px 0 4px;font-size:16px}
.card svg{width:100%;height:auto;display:block}
.step{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.step button{border:1.5px solid var(--soft);background:#fff;border-radius:10px;width:44px;height:40px;font:inherit;font-size:22px;line-height:1;color:var(--ink)}
.step span{min-width:44px;font-size:14px;color:#4A5560}
.tab{margin:8px 0 0;font-size:17px;letter-spacing:2px;font-weight:600;font-variant-numeric:tabular-nums}
.none{font-size:14px;color:#5B6671;padding:30px 6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.bar .lbl{font-weight:600}
.reset{border:1.5px solid var(--soft);background:var(--card);border-radius:10px;font:inherit;font-weight:600;min-height:44px;padding:0 14px;color:var(--ink)}
.draw{background:var(--card);border:1.5px solid var(--soft);border-radius:14px;padding:6px 6px 2px;margin-bottom:6px}
.draw svg{width:100%;height:auto;display:block;touch-action:manipulation}
.small{font-size:13px;color:#5B6671;margin:6px 2px 14px}
.found{margin:14px 0 6px;font-weight:600}
.single{max-width:260px;margin:10px auto 0}
</style>
</head>
<body>
<main>
  <h1>Griffwechsel: Gitarre → Ukulele</h1>
  <div class="tabs" role="tablist">
    <button class="on" data-act="tab" data-tab="pick" role="tab">Akkord wählen</button>
    <button data-act="tab" data-tab="draw" role="tab">Griff zeichnen</button>
  </div>

  <section id="pick">
    <input id="txt" type="text" placeholder="z. B. G-Moll, Fis7, Dm" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Akkord eingeben">
    <p class="hint" id="hint">B steht für B♭, H für B (deutsche Benennung).</p>
    <div class="roots" id="roots"></div>
    <div class="chips" id="quals"></div>
    <div id="pickResult"></div>
  </section>

  <section id="draw" class="hidden">
    <div class="bar">
      <div class="lbl" id="baseLbl"></div>
      <div class="step">
        <button data-act="base" data-d="-1" aria-label="Ausschnitt nach oben">‹</button>
        <button data-act="base" data-d="1" aria-label="Ausschnitt nach unten">›</button>
      </div>
      <button class="reset" data-act="reset">Löschen</button>
    </div>
    <div class="draw"><div id="drawSvg"></div></div>
    <p class="small">Tippe auf ein Feld, um einen Finger zu setzen. Oben wechselst du zwischen stumm (×) und leer (○). Beim Verschieben des Ausschnitts fallen Punkte außerhalb weg.</p>
    <div id="drawResult"></div>
  </section>
</main>

<script>
/*ENGINE*/
const NAMES=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B','H'];
const Q=[
 {id:'dur',chip:'Dur',suf:'-Dur',iv:[0,4,7]},
 {id:'moll',chip:'Moll',suf:'-Moll',iv:[0,3,7]},
 {id:'7',chip:'7',suf:'7',iv:[0,4,7,10]},
 {id:'m7',chip:'m7',suf:'m7',iv:[0,3,7,10]},
 {id:'maj7',chip:'maj7',suf:'maj7',iv:[0,4,7,11]},
 {id:'6',chip:'6',suf:'6',iv:[0,4,7,9]},
 {id:'sus2',chip:'sus2',suf:'sus2',iv:[0,2,7]},
 {id:'sus4',chip:'sus4',suf:'sus4',iv:[0,5,7]},
 {id:'dim',chip:'dim',suf:'dim',iv:[0,3,6]},
 {id:'aug',chip:'aug',suf:'aug',iv:[0,4,8]},
 {id:'add9',chip:'add9',suf:'add9',iv:[0,2,4,7]},
 {id:'m7b5',chip:'m7♭5',suf:'m7♭5',iv:[0,3,6,10]}
];
const GUITAR=[4,9,2,7,11,4];   // E A D G B E, tief nach hoch
const UKE=[7,0,4,9];           // G C E A (Re-entrant)

function voicings(open,root,q,guitar){
  const iv=q.iv.map(i=>(root+i)%12), set=new Set(iv);
  const req=iv.filter((p,i)=>!(q.iv.length>=4&&q.iv[i]===7));
  const n=open.length, found=new Map();
  function evalV(frets){
    const played=frets.map((f,i)=>f<0?null:(open[i]+f)%12);
    const pl=played.filter(x=>x!==null);
    if(pl.length<4)return null;
    const ps=new Set(pl);
    if(!req.every(p=>ps.has(p)))return null;
    if(guitar){
      const idx=[];frets.forEach((f,i)=>{if(f>=0)idx.push(i)});
      for(let i=idx[0];i<=idx[idx.length-1];i++)if(frets[i]<0)return null;
    }
    const fr=frets.filter(f=>f>0);
    const minF=fr.length?Math.min(...fr):0, maxF=fr.length?Math.max(...fr):0;
    const opens=frets.filter(f=>f===0).length;
    let fingers=fr.length,barre=false;
    if(fr.length>4){
      const atMin=[];frets.forEach((f,i)=>{if(f===minF)atMin.push(i)});
      if(atMin.length<2)return null;
      for(let i=atMin[0];i<=atMin[atMin.length-1];i++)if(frets[i]===0)return null;
      barre=true;fingers=1+fr.filter(f=>f>minF).length;
    }
    if(fingers>4)return null;
    const bassOk=guitar?played.find(x=>x!==null)===root:true;
    const mutes=frets.filter(f=>f<0).length;
    let score=mutes*1.0+(bassOk?0:2.5)+minF*0.35+fingers*(guitar?0.35:0.3)+(barre?0.8:0);
    if(guitar&&opens>0){
      const fi=[],oi=[];frets.forEach((f,i)=>{if(f>0)fi.push(i);else if(f===0)oi.push(i)});
      const sandwiched=oi.some(i=>fi.some(j=>j<i)&&fi.some(j=>j>i));
      if(sandwiched&&minF<=1&&maxF-minF>=2)score+=1.2;
      if(fingers>=4)score+=1.0;
    }
    return {frets,key:frets.join(','),score};
  }
  for(let s=0;s<=10;s++){
    const lo=s===0?1:s, hi=s===0?4:s+3;
    const opts=open.map(o=>{
      const a=[];
      if(guitar)a.push(-1);
      if(s===0&&set.has(o%12))a.push(0);
      for(let f=lo;f<=hi;f++)if(set.has((o+f)%12))a.push(f);
      return a;
    });
    const cur=new Array(n);
    (function rec(i){
      if(i===n){const v=evalV(cur.slice());if(v)found.set(v.key,v);return;}
      for(const f of opts[i]){cur[i]=f;rec(i+1);}
    })(0);
  }
  return [...found.values()].sort((a,b)=>a.score-b.score).slice(0,5);
}

function detect(open,frets){
  const played=frets.map((f,i)=>f<0?null:(open[i]+f)%12);
  const pl=played.filter(x=>x!==null);
  const pcs=new Set(pl);
  if(pcs.size<3)return [];
  const lowest=pl[0], out=[];
  for(let r=0;r<12;r++)Q.forEach((q,qi)=>{
    const iv=q.iv.map(i=>(r+i)%12), set=new Set(iv);
    const req=iv.filter((p,i)=>!(q.iv.length>=4&&q.iv[i]===7));
    if([...pcs].every(p=>set.has(p))&&req.every(p=>pcs.has(p)))
      out.push({root:r,q,qi,bass:lowest===r});
  });
  out.sort((a,b)=>(b.bass-a.bass)||(a.qi-b.qi));
  return out.slice(0,4);
}

const QM={'':'dur','dur':'dur','maj':'dur','major':'dur','m':'moll','moll':'moll','min':'moll','7':'7','maj7':'maj7','dur7':'maj7','m7':'m7','moll7':'m7','min7':'m7','6':'6','sus2':'sus2','sus4':'sus4','sus':'sus4','dim':'dim','aug':'aug','+':'aug','add9':'add9','m7b5':'m7b5'};
function parseChord(txt){
  const t=txt.trim().replace(/[\s\-_]/g,'').replace(/♯/g,'#').replace(/♭/g,'b');
  const m=t.match(/^([a-hA-H])(.*)$/);
  if(!m)return null;
  const L=m[1].toLowerCase();
  let pc={c:0,d:2,e:4,f:5,g:7,a:9,b:10,h:11}[L], r=m[2];
  const lr=r.toLowerCase();
  if(lr.startsWith('is')){pc+=1;r=r.slice(2);}
  else if(lr[0]==='#'){pc+=1;r=r.slice(1);}
  else if('cdfg'.includes(L)&&lr.startsWith('es')){pc-=1;r=r.slice(2);}
  else if('ea'.includes(L)&&lr[0]==='s'&&!lr.startsWith('sus')){pc-=1;r=r.slice(1);}
  else if(lr[0]==='b'){if(L!=='b')pc-=1;r=r.slice(1);}
  pc=((pc%12)+12)%12;
  const id=QM[r.toLowerCase()];
  if(id===undefined)return null;
  return {root:pc,qi:Q.findIndex(q=>q.id===id)};
}
/*END*/

const INK='#1D2733', UKEC='#1F7A74', BRASS='#B07A1E', LINE='#8C97A0';

function svgDiagram(open,frets,root,o){
  o=o||{};
  const n=open.length, W=o.w||160, nF=5, fs=o.fs||30, padL=o.padL||26, padR=14, padT=o.padT||34, padB=8;
  const ss=(W-padL-padR)/(n-1), H=padT+nF*fs+padB;
  const fr=frets.filter(f=>f>0);
  let base=o.base;
  if(!base){base=(fr.length&&Math.max(...fr)>5)?Math.min(...fr):1;}
  const color=o.color||INK, rad=Math.min(fs*0.34,ss*0.38);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="ui-rounded,system-ui,sans-serif">`;
  for(let i=0;i<=nF;i++){
    const y=padT+i*fs, thick=(i===0&&base===1);
    s+=`<line x1="${padL}" x2="${padL+(n-1)*ss}" y1="${y}" y2="${y}" stroke="${thick?color:LINE}" stroke-width="${thick?5:1.5}"/>`;
  }
  for(let i=0;i<n;i++){
    const x=padL+i*ss;
    s+=`<line x1="${x}" x2="${x}" y1="${padT}" y2="${padT+nF*fs}" stroke="${LINE}" stroke-width="${1.2+(n===6?(5-i)*0.12:0)}"/>`;
  }
  if(base>1)s+=`<text x="${padL-9}" y="${padT+fs/2+5}" text-anchor="end" font-size="${o.interactive?17:14}" font-weight="700" fill="${color}">${base}</text>`;
  if(o.interactive){
    for(let i=0;i<n;i++)for(let r=0;r<nF;r++){
      s+=`<circle cx="${padL+i*ss}" cy="${padT+r*fs+fs/2}" r="4" fill="#C9CEC6"/>`;
    }
  }
  for(let i=0;i<n;i++){
    const x=padL+i*ss, f=frets[i];
    if(f<0)s+=`<text x="${x}" y="${padT-14}" text-anchor="middle" font-size="20" font-weight="700" fill="${LINE}">×</text>`;
    else if(f===0)s+=`<circle cx="${x}" cy="${padT-17}" r="6" fill="none" stroke="${color}" stroke-width="2"/>`;
    else{
      const r=f-base;
      if(r>=0&&r<nF){
        const isRoot=root>=0&&((open[i]+f)%12===root);
        s+=`<circle cx="${x}" cy="${padT+r*fs+fs/2}" r="${rad}" fill="${isRoot?BRASS:color}"/>`;
      }
    }
  }
  if(o.interactive){
    for(let i=0;i<n;i++){
      const x=padL+i*ss-ss/2;
      s+=`<rect data-act="cell" data-s="${i}" data-f="h" x="${x}" y="0" width="${ss}" height="${padT}" fill="transparent"/>`;
      for(let r=0;r<nF;r++)
        s+=`<rect data-act="cell" data-s="${i}" data-f="${base+r}" x="${x}" y="${padT+r*fs}" width="${ss}" height="${fs}" fill="transparent"/>`;
    }
  }
  return s+'</svg>';
}

function tabStr(frets){
  const big=frets.some(f=>f>=10);
  return frets.map(f=>f<0?'x':f).join(big?'-':'');
}
function card(title,color,open,list,idx,root,which){
  if(!list.length)return `<section class="card"><h3 style="color:${color}">${title}</h3><p class="none">Kein bequemer Griff gefunden.</p></section>`;
  const v=list[idx];
  return `<section class="card"><h3 style="color:${color}">${title}</h3>${svgDiagram(open,v.frets,root,{color})}
  <div class="step"><button data-act="step" data-w="${which}" data-d="-1" aria-label="Vorheriger Griff">‹</button><span>${idx+1} / ${list.length}</span><button data-act="step" data-w="${which}" data-d="1" aria-label="Nächster Griff">›</button></div>
  <p class="tab">${tabStr(v.frets)}</p></section>`;
}

const S={mode:'pick',root:7,q:1,gi:0,ui:0,draw:[-1,-1,-1,-1,-1,-1],base:1,di:0,ui2:0};
const $=id=>document.getElementById(id);
const mod=(i,n)=>((i%n)+n)%n;

function renderPick(){
  $('roots').innerHTML=NAMES.map((n,i)=>`<button class="chip ${i===S.root?'on':''}" data-act="root" data-v="${i}">${n}</button>`).join('');
  $('quals').innerHTML=Q.map((q,i)=>`<button class="chip ${i===S.q?'on':''}" data-act="qual" data-v="${i}">${q.chip}</button>`).join('');
  const q=Q[S.q], gv=voicings(GUITAR,S.root,q,true), uv=voicings(UKE,S.root,q,false);
  S.gi=gv.length?mod(S.gi,gv.length):0; S.ui=uv.length?mod(S.ui,uv.length):0;
  const tones=q.iv.map(i=>NAMES[(S.root+i)%12]).join(' – ');
  $('pickResult').innerHTML=`<h2 class="chord">${NAMES[S.root]+q.suf}</h2><p class="notes">Töne: ${tones}</p>
  <div class="pair">${card('Gitarre',INK,GUITAR,gv,S.gi,S.root,'g')}${card('Ukulele',UKEC,UKE,uv,S.ui,S.root,'u')}</div>`;
}

function renderDraw(){
  const det=detect(GUITAR,S.draw);
  if(S.di>=det.length)S.di=0;
  const sel=det[S.di];
  $('baseLbl').textContent='Ausschnitt ab Bund '+S.base;
  $('drawSvg').innerHTML=svgDiagram(GUITAR,S.draw,sel?sel.root:-1,{interactive:true,base:S.base,color:INK,w:320,fs:46,padL:38,padT:46});
  let h='';
  const playedCount=S.draw.filter(f=>f>=0).length;
  if(!sel){
    h=`<p class="found">${playedCount<3?'Setze mindestens drei Töne.':'Kein bekannter Akkord erkannt.'}</p>`;
  }else{
    h=`<p class="found">Erkannt:</p><div class="chips">`+det.map((d,i)=>`<button class="chip ${i===S.di?'on':''}" data-act="detsel" data-v="${i}">${NAMES[d.root]+d.q.suf}</button>`).join('')+`</div>`;
    const uv=voicings(UKE,sel.root,sel.q,false);
    S.ui2=uv.length?mod(S.ui2,uv.length):0;
    h+=`<div class="single">${card('Ukulele',UKEC,UKE,uv,S.ui2,sel.root,'d')}</div>`;
  }
  $('drawResult').innerHTML=h;
}

function setMode(m){
  S.mode=m;
  $('pick').classList.toggle('hidden',m!=='pick');
  $('draw').classList.toggle('hidden',m!=='draw');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===m));
  m==='pick'?renderPick():renderDraw();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act;
  if(a==='tab')setMode(el.dataset.tab);
  else if(a==='root'){S.root=+el.dataset.v;S.gi=S.ui=0;$('txt').value='';renderPick();}
  else if(a==='qual'){S.q=+el.dataset.v;S.gi=S.ui=0;$('txt').value='';renderPick();}
  else if(a==='step'){
    const d=+el.dataset.d, w=el.dataset.w;
    if(w==='g')S.gi+=d; else if(w==='u')S.ui+=d; else S.ui2+=d;
    S.mode==='pick'?renderPick():renderDraw();
  }
  else if(a==='base'){
    S.base=Math.max(1,Math.min(12,S.base+(+el.dataset.d)));
    S.draw=S.draw.map(f=>(f>0&&(f<S.base||f>S.base+4))?-1:f);
    renderDraw();
  }
  else if(a==='cell'){
    const s=+el.dataset.s, f=el.dataset.f;
    if(f==='h')S.draw[s]=S.draw[s]===-1?0:-1;
    else{const fv=+f;S.draw[s]=S.draw[s]===fv?-1:fv;}
    S.di=0;S.ui2=0;renderDraw();
  }
  else if(a==='detsel'){S.di=+el.dataset.v;S.ui2=0;renderDraw();}
  else if(a==='reset'){S.draw=[-1,-1,-1,-1,-1,-1];S.di=0;S.ui2=0;renderDraw();}
});

$('txt').addEventListener('input',e=>{
  const v=e.target.value;
  if(!v.trim()){$('hint').textContent='B steht für B♭, H für B (deutsche Benennung).';return;}
  const p=parseChord(v);
  if(p){S.root=p.root;S.q=p.qi;S.gi=S.ui=0;$('hint').textContent='B steht für B♭, H für B (deutsche Benennung).';renderPick();}
  else $('hint').textContent='Nicht erkannt. Probiere z. B. Dm, G-Moll, Fis7 oder Asus4.';
});

renderPick();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
</script>
</body>
</html>
